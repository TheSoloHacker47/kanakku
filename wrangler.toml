name = "kanakku"
main = "crates/worker/build/index.js"
compatibility_date = "2026-09-01"

[build]
command = "cd crates/worker && worker-build --release"
watch_dir = ["crates/core/src", "crates/worker/src"]

[assets]
directory = "./assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kanakku"
database_id = "1a259aed-86ec-48d3-a120-9500c88f9f09"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kanakku"

[triggers]
crons = ["0 21 * * *"] # 02:30 IST

[vars]
PILOT_DISTRICT = "*" # one district by name, or * for the whole state
EDGE_CACHE = "on"
CONTACT = "" # a URL or address for the scraper's User-Agent, so KIIFB can reach you

[observability]
enabled = true
